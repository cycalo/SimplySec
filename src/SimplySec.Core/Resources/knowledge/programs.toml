# Known programs that open network ports, described in neutral words.
#
# Findings about these programs are about WHO CAN REACH THEM, never about the program being
# bad. `risk` is the starting risk when other devices on a Public network can reach it.
#
# Fields
#   id           stable id
#   exe          lower-case image names
#   name         product name
#   description  neutral phrase used in titles, e.g. "Ollama, your local AI model server"
#   risk         info | low | medium | high | critical
#   explain      what it means when other devices can reach it
#   intent_env   optional environment variable whose value shows the user chose to expose it
#                (a non-loopback bind address such as 0.0.0.0 means "you set this up")
#   ports        ports the program normally uses (informational)

[[program]]
id = "ollama"
exe = ["ollama.exe", "ollama app.exe"]
name = "Ollama"
description = "Ollama, your local AI model server"
risk = "medium"
explain = "The Ollama API has no password: whoever can reach it can use your models and list or download them."
intent_env = "OLLAMA_HOST"
ports = [11434]

[[program]]
id = "cursor"
exe = ["cursor.exe"]
name = "Cursor"
description = "Cursor, your code editor"
risk = "medium"
explain = "Cursor opens ports for development servers and port forwarding. These usually have no login, so whoever can reach them can see what they serve."
ports = [3000]

[[program]]
id = "vscode"
exe = ["code.exe"]
name = "Visual Studio Code"
description = "Visual Studio Code, your code editor"
risk = "medium"
explain = "VS Code opens ports for development servers and port forwarding, which usually have no login."

[[program]]
id = "spotify"
exe = ["spotify.exe", "spotifylauncher.exe"]
name = "Spotify"
description = "Spotify, your music app"
risk = "low"
explain = "Spotify Connect uses this port so your phone and speakers on the same network can find and control playback."

[[program]]
id = "tailscale"
exe = ["tailscaled.exe", "tailscale-ipn.exe", "tailscale.exe"]
name = "Tailscale"
description = "Tailscale, your private VPN"
risk = "info"
explain = "Tailscale only accepts encrypted connections from devices in your own Tailscale network."

[[program]]
id = "adb"
exe = ["adb.exe"]
name = "Android Debug Bridge"
description = "Android Debug Bridge (Android developer tools)"
risk = "medium"
explain = "adb controls Android phones connected to this PC. If others could reach it they could control those phones."
ports = [5037]

[[program]]
id = "vmware"
exe = ["vmware-authd.exe", "vmnat.exe", "vmnetdhcp.exe", "vmware.exe", "vmware-hostd.exe", "vmware-vmx.exe"]
name = "VMware Workstation"
description = "VMware Workstation, your virtual-machine software"
risk = "low"
explain = "VMware uses these ports for its virtual networks and remote consoles."
ports = [902, 912]

