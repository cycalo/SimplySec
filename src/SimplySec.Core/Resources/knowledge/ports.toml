# SimplySec port knowledge: the single source of truth.
#
# Texts describe what it means when THIS PC listens on the port (v1 described client use,
# which was misleading). `risk` is the risk when other devices on a Public network can reach
# it; scoring lowers it for Private networks and VPN-only exposure.
#
# Fields
#   port, protocol   tcp | udp
#   name             short name shown in tables
#   risk             info | low | medium | high | critical
#   summary          one plain sentence: what this is
#   explain          what it means if other devices can reach it
#   advice           what to do
#   topic            optional link to a check module (rdp, smb, netbios, llmnr, wsd, rpc, winrm)
#   kernel           true: Windows itself (PID 4, "System") listens; identified by port
#   service          Windows service behind it, when known
#   lan_probe        true: probed on other devices during a home-network scan (M2)
#   discovery        true: a shared discovery protocol (mDNS, SSDP, WS-Discovery). Its risk
#                    is the protocol's, whichever program uses it
#   fixes            fix ids offered for this port (validated by tests)

[[port]]
port = 20
protocol = "tcp"
name = "FTP data"
risk = "high"
summary = "The data channel of an FTP file server."
explain = "FTP sends files and passwords without encryption, so anyone on the network can read them."
advice = "Turn off the FTP server if you don't use it, or switch to SFTP."
fixes = ["exposure.block_port", "exposure.block_program"]

[[port]]
port = 21
protocol = "tcp"
name = "FTP"
risk = "high"
summary = "An FTP file server accepts logins on this port."
explain = "FTP sends files and passwords without encryption, and FTP servers are scanned for constantly."
advice = "Turn off the FTP server if you don't use it, or switch to SFTP."
lan_probe = true
fixes = ["exposure.block_port", "exposure.block_program"]

[[port]]
port = 22
protocol = "tcp"
name = "SSH"
risk = "medium"
summary = "An SSH server: encrypted remote command-line access to this PC."
explain = "SSH is encrypted, but anyone who can reach it can try to guess passwords."
advice = "Keep it only if you use it. Prefer key-based login and turn off password login."
lan_probe = true
fixes = ["exposure.block_port", "exposure.block_program"]

[[port]]
port = 23
protocol = "tcp"
name = "Telnet"
risk = "critical"
summary = "A Telnet server: old, unencrypted remote access."
explain = "Telnet sends everything, including passwords, as plain text. Anyone on the network can take over the session."
advice = "Turn it off. Use SSH instead."
lan_probe = true
fixes = ["exposure.block_port", "exposure.block_program"]

[[port]]
port = 25
protocol = "tcp"
name = "SMTP"
risk = "medium"
summary = "A mail server that accepts email."
explain = "A mail server reachable by others can be abused to send spam if it is not configured carefully."
advice = "Only run a mail server if you meant to."
lan_probe = true
fixes = ["exposure.block_port", "exposure.block_program"]

[[port]]
port = 53
protocol = "tcp"
name = "DNS server"
risk = "medium"
summary = "A DNS server: it answers name lookups for other devices."
explain = "An open DNS server can be abused to attack others. Most PCs never need one."
advice = "Turn it off unless this PC is meant to be your network's DNS server."
lan_probe = true
fixes = ["exposure.block_port", "exposure.block_program"]

[[port]]
port = 53
protocol = "udp"
name = "DNS server"
risk = "medium"
