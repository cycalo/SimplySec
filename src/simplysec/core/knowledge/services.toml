# Windows services that host listeners, described in plain words.
#
# Fields
#   name         service name (case-insensitive)
#   display      friendly name
#   description  plain sentence
#   risk         starting risk when reachable on a Public network (overrides the port's
#                dynamic-range default for services on random RPC ports)
#   never_touch  true: SimplySec never stops, disables or reconfigures this service
#                (from v1's critical-services list, extended)

[[service]]
name = "RpcSs"
display = "Remote Procedure Call (RPC)"
description = "Core Windows plumbing that lets programs and services talk to each other."
risk = "high"
never_touch = true

[[service]]
name = "RpcEptMapper"
display = "RPC Endpoint Mapper"
description = "Tells other computers which remote management services this PC offers."
risk = "high"
never_touch = true

